name: Swift Format

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: swift-format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Check Swift Formatting
    runs-on: ubuntu-24.04

    container:
      image: swift:6.2-jammy

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify Swift Format
        run: |
          swift-format --version

      - name: Format Swift files
        run: |
          swift-format format \
            --recursive \
            --parallel \
            --in-place \
            --configuration .swift-format \
            Sources Tests

      - name: Check formatting changes
        run: |
          if ! git diff --quiet -- '*.swift'; then
            echo "Swift formatting issues found:"
            echo
            git diff -- '*.swift'
            exit 1
          fi

          echo "Swift formatting is valid."
